<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrapekit</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f1; --card: #ffffff; --text: #1c1b19; --muted: #6b6a66;
    --border: #dcdad3; --accent: #c2410c; --accent-text: #ffffff; --code: #efede6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413; --card: #1f1e1c; --text: #ecebe6; --muted: #9b9a94;
      --border: #34322e; --accent: #fb923c; --accent-text: #1a1209; --code: #2a2825;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  label { display: block; font-size: .85rem; color: var(--muted); margin: 14px 0 4px; }
  label:first-child { margin-top: 0; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
          border: 1px solid var(--border); border-radius: 8px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font: inherit; font-size: .8rem; padding: 3px 10px; border-radius: 999px; cursor: pointer;
          background: var(--code); color: var(--text); border: 1px solid var(--border); }
  .chip:hover { border-color: var(--accent); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  button.primary { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px;
                   background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.secondary { font: inherit; padding: 10px 14px; border-radius: 8px; cursor: pointer;
                     background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: 20px 0 8px; color: var(--muted); font-size: .9rem; min-height: 1.4em; }
  #status.error { color: #dc2626; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: n; }
  li { counter-increment: n; display: flex; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border);
       word-break: break-word; }
  li::before { content: counter(n); color: var(--muted); min-width: 2ch; text-align: right; font-size: .85rem; padding-top: 2px; }
  li:first-child { border-top: 0; }
  #results.card { display: none; }
</style>
</head>
<body>
<main>
  <h1>scrape<span>kit</span></h1>
  <p class="sub">URL und CSS-Selektor eingeben, Treffer ansehen und kopieren.</p>

  <div class="card">
    <label for="url">URL</label>
    <input id="url" type="url" placeholder="https://www.rust-lang.org" value="https://www.rust-lang.org">

    <div class="row">
      <div>
        <label for="selector">CSS-Selektor</label>
        <input id="selector" value="a">
      </div>
      <div>
        <label for="attr">Attribut (leer = Text)</label>
        <input id="attr" value="href">
      </div>
    </div>

    <div class="presets">
      <button class="chip" data-sel="a" data-attr="href">Links</button>
      <button class="chip" data-sel="h1, h2, h3" data-attr="">Überschriften</button>
      <button class="chip" data-sel="img" data-attr="src">Bilder</button>
      <button class="chip" data-sel="p" data-attr="">Absätze</button>
    </div>

    <div class="actions">
      <button class="primary" id="go">Scrapen</button>
      <button class="secondary" id="copy" disabled>JSON kopieren</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="results" class="card"><ol id="list"></ol></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let current = [];

  document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      $("selector").value = chip.dataset.sel;
      $("attr").value = chip.dataset.attr;
    });
  });

  async function run() {
    const status = $("status");
    status.className = "";
    status.textContent = "Lade …";
    $("go").disabled = true;
    $("copy").disabled = true;
    $("results").style.display = "none";

    try {
      const res = await fetch("/api/scrape", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          url: $("url").value.trim(),
          selector: $("selector").value.trim(),
          attr: $("attr").value.trim() || null,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Unbekannter Fehler");

      current = data.results;
      const list = $("list");
      list.replaceChildren(...current.map((text) => {
        const li = document.createElement("li");
        li.textContent = text; // textContent statt innerHTML: kein XSS durch gescrapte Inhalte
        return li;
      }));
      status.textContent = current.length + " Treffer";
      if (current.length) {
        $("results").style.display = "block";
        $("copy").disabled = false;
      }
    } catch (err) {
      status.className = "error";
      status.textContent = err.message;
    } finally {
      $("go").disabled = false;
    }
  }

  $("go").addEventListener("click", run);
  document.querySelectorAll("input").forEach((i) =>
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); }));

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(JSON.stringify(current, null, 2));
      $("status").textContent = "JSON kopiert";
    } catch (_) {
      $("status").textContent = "Kopieren nicht möglich";
    }
  });
</script>
</body>
</html>
